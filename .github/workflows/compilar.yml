name: Compilar practica ESP32
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar PlatformIO
        run: python -m pip install platformio
      - name: Compilar informacion del chip
        run: python -m platformio run -d Practica02-info-chip
      - name: Compilar etapas y experimentos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          p = Path("Practica02-freertos/include/configuracion.h")
          original = p.read_text()
          try:
              for etapa, experimento in [(1, 0), (2, 0)] + [(3, i) for i in range(6)]:
                  s = re.sub(r"#define ETAPA \d+", f"#define ETAPA {etapa}", original)
                  s = re.sub(r"#define EXPERIMENTO \d+", f"#define EXPERIMENTO {experimento}", s)
                  p.write_text(s)
                  print(f"VALIDACION ETAPA {etapa} EXPERIMENTO {experimento}", flush=True)
                  subprocess.run([sys.executable, "-m", "platformio", "run", "-d", "Practica02-freertos"], check=True)
          finally:
              p.write_text(original)
          PY
